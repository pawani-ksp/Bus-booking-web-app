<div class="register-page">
  <div class="register-background">
    <form class="register-card" autocomplete="on" (submit)="onSubmit($event)">
      <h1>Register</h1>
      <p class="register-subtitle">Create an account to book your bus seat.</p>

      @if (errorMsg()) {
        <p class="form-error" role="alert">{{ errorMsg() }}</p>
      }

      <div class="form-group">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Enter your full name" required />
      </div>

      <div class="form-group">
        <label for="number">Phone number</label>
        <input id="number" name="number" type="tel" placeholder="Enter your phone number" required />
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm your password" required />
      </div>

      <div class="form-group">
        <label for="role">Account type</label>
        <select id="role" name="role" required>
          <option value="passenger">Passenger</option>
          <option value="owner">Bus Owner</option>
          <option value="driver">Driver</option>
        </select>
      </div>

      <button type="submit" class="register-btn" [disabled]="loading()">
        @if (loading()) { Creating account… } @else { Register }
      </button>

      <p class="register-footer">
        Already have an account?
        <a routerLink="/login">Log in</a>
      </p>
    </form>
  </div>
</div>
