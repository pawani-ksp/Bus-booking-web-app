<header class="app-header">
	<a class="brand" routerLink="/landing" aria-label="Weerawarna Express home">
		<span class="brand-logo">
			<img src="/images/logo.png" alt="Weerawarna Express logo">
		</span>
		<span class="brand-text">
			<strong>Weerawarna Express</strong>
			<small>Bus Booking System</small>
		</span>
	</a>

	<nav class="app-nav" aria-label="Main navigation">
		<a routerLink="/bus-list" routerLinkActive="active">Buses</a>
		<a routerLink="/bus-station-map" routerLinkActive="active">Station Map</a>
		<a routerLink="/route-map" routerLinkActive="active">Route Map</a>

		@if (isLoggedIn()) {
			<a [routerLink]="dashboardRoute()" routerLinkActive="active">Dashboard</a>
			<button type="button" class="nav-logout" (click)="logout()">Log out</button>
		} @else {
			<a routerLink="/login"    routerLinkActive="active">Log in</a>
			<a routerLink="/register" routerLinkActive="active" class="nav-register">Register</a>
		}
	</nav>
</header>

<main class="app-content">
	<router-outlet></router-outlet>
</main>
